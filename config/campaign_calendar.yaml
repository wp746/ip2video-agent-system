annual_nodes:
  元旦:
    date_rule: 每年 1 月 1 日
    category: public_holiday
    audience_emotion: 新开始、计划感、祝福
    visual_symbols: [日历第一页, 晨光, 新年数字, 礼物, 干净空间]
    content_angles: [新年计划, 陪伴开启, 企业年度关怀, 品牌新承诺]
    poster_motifs: [新年数字与 IP 互动, 晨光中的 IP, 品牌祝福卡]
    forbidden_tones: [空泛口号, 过度鸡血]
  春节:
    date_rule: 农历正月初一
    category: lunar_festival
    audience_emotion: 团圆、祝福、热闹、归家
    visual_symbols: [灯笼, 春联, 红包, 团圆饭, 烟花, 窗花]
    content_angles: [团圆守护, 新春祝福, 家庭关怀, 品牌年味]
    poster_motifs: [IP 贴春联, IP 递红包, 团圆桌边的 IP]
    forbidden_tones: [廉价红金堆砌, 迷信承诺]
  元宵节:
    date_rule: 农历正月十五
    category: lunar_festival
    audience_emotion: 团圆延续、灯火、甜蜜
    visual_symbols: [花灯, 汤圆, 灯谜, 月亮]
    content_angles: [把关怀包进汤圆, 灯火里的陪伴, 节后收心]
    poster_motifs: [IP 提花灯, IP 和汤圆互动, 灯谜式标题]
    forbidden_tones: [视觉过满, 民俗符号错用]
  妇女节:
    date_rule: 每年 3 月 8 日
    category: social_node
    audience_emotion: 尊重、看见、力量、柔软
    visual_symbols: [花, 书, 光, 女性剪影, 职场空间]
    content_angles: [看见她的日常, 给女性用户的关怀, 品牌尊重]
    poster_motifs: [IP 送花但不讨好, IP 守护女性日常, 温柔光影海报]
    forbidden_tones: [消费主义套路, 刻板女性形象]
  清明节:
    date_rule: 每年 4 月 4-6 日
    category: solar_term_holiday
    audience_emotion: 思念、清朗、慎终追远
    visual_symbols: [柳枝, 细雨, 青团, 山水, 白花]
    content_angles: [思念与守护, 清朗生活, 春日健康提醒]
    poster_motifs: [IP 持柳枝, 细雨中的清朗画面, 青团与春日]
    forbidden_tones: [嬉闹营销, 过度商业化]
  劳动节:
    date_rule: 每年 5 月 1 日
    category: public_holiday
    audience_emotion: 致敬、休整、踏实、专业
    visual_symbols: [工具, 工作台, 勋章, 阳光, 城市]
    content_angles: [致敬一线, 专业背后的努力, 假期关怀]
    poster_motifs: [IP 递上勋章, 工作场景中的 IP, 休整提示卡]
    forbidden_tones: [空喊致敬, 压榨式奋斗叙事]
  母亲节:
    date_rule: 每年 5 月第二个星期日
    category: social_node
